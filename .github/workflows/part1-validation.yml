name: Validate Part 1 Submission

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-part1:
    name: Validate Part 1 files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build planning checks
        run: dotnet build tools/RaceDay.PlanningChecks --configuration Release

      - name: Validate planning documents
        run: dotnet run --project tools/RaceDay.PlanningChecks --configuration Release --no-build

