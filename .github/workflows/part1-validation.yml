name: Validate Part 1 Submission

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-part1:
    name: Validate Part 1 files
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ${{ vars.RACEDAY_USE_LOCAL_RUNNER == 'true' && fromJSON('["self-hosted","Windows","X64","raceday"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build planning checks
        run: dotnet build tools/RaceDay.PlanningChecks --configuration Release

      - name: Validate planning documents
        run: dotnet run --project tools/RaceDay.PlanningChecks --configuration Release --no-build

