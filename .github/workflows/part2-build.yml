name: Build and Test RaceDay

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test API and MVC
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ${{ vars.RACEDAY_USE_LOCAL_RUNNER == 'true' && fromJSON('["self-hosted","Windows","X64","raceday"]') || 'windows-2025' }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Start local blob storage
        shell: pwsh
        run: |
          function BlobReady {
            try {
              $response = Invoke-WebRequest 'http://127.0.0.1:10000/devstoreaccount1?comp=list' -SkipHttpErrorCheck -TimeoutSec 2
              return ($response.Headers.Server -like 'Azurite-Blob*')
            } catch { return $false }
          }
          if (BlobReady) { Write-Output 'Using the running local Azurite instance.'; exit 0 }
          $emulatorTools = Join-Path $env:RUNNER_TEMP 'raceday-emulator'
          $emulatorData = Join-Path $env:RUNNER_TEMP 'raceday-blob-data'
          npm install --prefix $emulatorTools --no-audit --no-fund azurite@3.37.0
          if ($LASTEXITCODE -ne 0) { throw 'Azurite installation failed.' }
          $emulatorEntry = Join-Path $emulatorTools 'node_modules/azurite/dist/src/blob/main.js'
          $emulator = Start-Process -FilePath (Get-Command node).Source -WindowStyle Hidden -PassThru -ArgumentList @("`"$emulatorEntry`"", '--silent', '--blobHost', '127.0.0.1', '--location', "`"$emulatorData`"")
          "RACEDAY_AZURITE_PID=$($emulator.Id)" >> $env:GITHUB_ENV
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            if (BlobReady) { exit 0 }
            Start-Sleep -Seconds 1
          }
          throw 'Azurite did not become ready.'

      - name: Restore packages
        run: dotnet restore RaceDay.sln

      - name: Restore migration tool
        run: dotnet tool restore

      - name: Build API, MVC and tests
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Run API and MVC tests
        run: dotnet test RaceDay.sln --configuration Release --no-build

      - name: Check for missing migrations
        run: dotnet ef migrations has-pending-model-changes --project src/RaceDay.Api --configuration Release --no-build
        env:
          ASPNETCORE_ENVIRONMENT: Development

      - name: Stop storage started by this job
        if: always()
        shell: pwsh
        run: |
          if ($env:RACEDAY_AZURITE_PID) {
            Stop-Process -Id ([int]$env:RACEDAY_AZURITE_PID) -ErrorAction SilentlyContinue
          }

# References
