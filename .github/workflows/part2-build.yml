name: Build and Test RaceDay API

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test API
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore RaceDay.sln

      - name: Restore migration tool
        run: dotnet tool restore

      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RaceDay.sln --configuration Release --no-build

      - name: Check for missing migrations
        run: dotnet ef migrations has-pending-model-changes --project src/RaceDay.Api --configuration Release --no-build
        env:
          ASPNETCORE_ENVIRONMENT: Development

