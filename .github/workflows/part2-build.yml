name: Build and Test RaceDay API

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test API
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Start local blob storage
        shell: pwsh
        run: |
          $emulatorTools = Join-Path $env:RUNNER_TEMP 'raceday-emulator'
          $emulatorData = Join-Path $env:RUNNER_TEMP 'raceday-blob-data'
          npm install --prefix $emulatorTools --no-audit --no-fund azurite@3.37.0
          if ($LASTEXITCODE -ne 0) { throw 'Azurite installation failed.' }
          $emulatorEntry = Join-Path $emulatorTools 'node_modules/azurite/dist/src/blob/main.js'
          Start-Process -FilePath (Get-Command node).Source -WindowStyle Hidden -ArgumentList @("`"$emulatorEntry`"", '--silent', '--blobHost', '127.0.0.1', '--location', "`"$emulatorData`"")

      - name: Restore packages
        run: dotnet restore RaceDay.sln

      - name: Restore migration tool
        run: dotnet tool restore

      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RaceDay.sln --configuration Release --no-build

      - name: Check for missing migrations
        run: dotnet ef migrations has-pending-model-changes --project src/RaceDay.Api --configuration Release --no-build
        env:
          ASPNETCORE_ENVIRONMENT: Development

# References
# GitHub (2026) 'Building and testing .NET', GitHub Docs.
# https://docs.github.com/en/actions/tutorials/build-and-test-code/building-and-testing-net
